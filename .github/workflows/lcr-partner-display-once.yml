name: LCR one-shot partner SVG optimization
on:
  push:
    branches:
      - feat/ecossistema-svg-builder2-20261113
    paths:
      - .github/workflows/lcr-partner-display-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Generate SVG derivatives without changing original logos
        run: npm run partners:optimize
      - name: Commit derived SVGs and compression report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/img-logos-parceiros-foton/display-svg assets/partner-svg-display-report.json
          if ! git diff --cached --quiet; then
            git commit -m "perf(partners): generate 31 optimized SVG previews from approved originals"
            git push origin HEAD:refs/heads/feat/ecossistema-svg-builder2-20261113
          fi
