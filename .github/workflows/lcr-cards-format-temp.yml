name: Format LCR cards branch (temporary)
on:
  push:
    branches: [feat/lcr-card-library-20261122]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lcr-card-library-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install locked dependencies
        working-directory: code
        run: npm ci
      - name: Format changed cards and animation docs
        working-directory: code
        run: |
          npx prettier --write             src/components/cards/             src/components/animations/             src/components/InstitutePurpose.tsx             src/components/InstituteTeamDashboard.tsx             src/components/NewsPhotoHighlights.tsx             src/features/PublicPages.tsx             src/features/OfficialStatements.tsx             src/features/ResearchPages.tsx             src/features/ElectromagneticWaveDivider.tsx             tests/cards.test.tsx             tests/browser/cards-standardization.spec.ts
      - name: Commit formatting to isolated branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/components/cards code/src/components/animations             code/src/components/InstitutePurpose.tsx code/src/components/InstituteTeamDashboard.tsx             code/src/components/NewsPhotoHighlights.tsx code/src/features/PublicPages.tsx             code/src/features/OfficialStatements.tsx code/src/features/ResearchPages.tsx             code/src/features/ElectromagneticWaveDivider.tsx code/tests/cards.test.tsx             code/tests/browser/cards-standardization.spec.ts
          git commit -m "style(cards): formatar arquivos e documentação LCR"
          git push origin HEAD:feat/lcr-card-library-20261122
