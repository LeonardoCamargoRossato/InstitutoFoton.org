name: Deploy Instituto Foton
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    env:
      VITE_BASE_PATH: /InstitutoFoton.org/
      VITE_SITE_ORIGIN: https://leonardocamargorossato.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run docs:check
      - run: npm run format:check
      - run: npm run check
      - run: npm run assets:verify
      - run: npm run artifact:check
      - name: Preparar Chromium para testes
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --only-shell
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-results
          path: code/test-results/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
