name: Importar parceiros públicos do site comercial
on:
  push:
    branches: [feat/ecossistema-parceiros-20261113]
    paths: [.github/workflows/import-partners-public.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-public:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - name: Ler apenas os cards públicos do site comercial
        run: node scripts/import-partners-public.mjs
      - name: Verificar artefato estático e conteúdo
        run: |
          npm run check
          npm run artifact:check
      - name: Commit de inventário e logos reais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/partners.json assets/partners-source-inventory.json assets/partner-source-originals public/assets/PNG/parceiros public/assets/WebP/parceiros
          if ! git diff --cached --quiet; then
            git commit -m "feat(partners): import published partner names and logos from public source"
            git fetch origin feat/ecossistema-parceiros-20261113
            git rebase origin/feat/ecossistema-parceiros-20261113
            git push origin HEAD:feat/ecossistema-parceiros-20261113
          fi
