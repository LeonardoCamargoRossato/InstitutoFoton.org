name: Format carousel feature branch (temporary)
on:
  push:
    branches: [feat/carrossel-universal-20261122]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/carrossel-universal-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install locked dependencies
        working-directory: code
        run: npm ci
      - name: Format documented and tested files
        working-directory: code
        run: |
          npx prettier --write src/components/ImageZoomDialog.tsx tests/browser/ResearchJourney.spec.ts src/components/carousel/PARAMETROS_DO_CARROSSEL.md tests/browser/carousel-visual-evidence.spec.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/components/ImageZoomDialog.tsx code/tests/browser/ResearchJourney.spec.ts code/src/components/carousel/PARAMETROS_DO_CARROSSEL.md code/tests/browser/carousel-visual-evidence.spec.ts
          git commit -m "style(carousel): formatar matriz e evidências visuais"
          git push origin HEAD:feat/carrossel-universal-20261122
