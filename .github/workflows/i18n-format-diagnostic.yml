name: i18n formatting diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Show formatting changes for Spanish integration
        run: |
          npx prettier --write src/app/Layout.tsx src/features/Documents.tsx src/features/InstagramHighlight.tsx src/features/LinkedInHighlight.tsx src/features/YouTubeHighlight.tsx src/pages/02-instituto/sections/InstitutePurpose.tsx
          git diff --no-ext-diff -- src
