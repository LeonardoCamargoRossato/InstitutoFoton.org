name: Format foundation test once
on:
  push:
    branches: [feat/fundacao-instituto-foton-20261114]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fundacao-instituto-foton-20261114
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - run: npx prettier --write tests/browser/foundation.spec.ts
        working-directory: code
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/tests/browser/foundation.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(fundacao): formatar testes de navegador"
            git push origin HEAD:feat/fundacao-instituto-foton-20261114
          fi
