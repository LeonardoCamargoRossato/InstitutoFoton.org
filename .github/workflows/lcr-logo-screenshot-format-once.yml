name: LCR one-shot logo screenshot test format
on:
  push:
    branches:
      - feat/ecossistema-svg-builder2-20261113
    paths:
      - .github/workflows/lcr-logo-screenshot-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx prettier --write tests/browser/partners-performance.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/browser/partners-performance.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(partners): format screenshot-based logo visibility test"
            git push origin HEAD:refs/heads/feat/ecossistema-svg-builder2-20261113
          fi
