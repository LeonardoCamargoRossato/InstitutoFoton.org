name: LCR one-shot photon lint formatting
on:
  push:
    branches:
      - hotfix/editorial-atemporal-animacao-foton-20261113
    paths:
      - .github/workflows/lcr-photon-prettier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx prettier --write src/components/PhotonIdentityAnimation.tsx
      - name: Commit component formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/PhotonIdentityAnimation.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(instituto): format reduced-motion state initialization"
            git push origin HEAD:refs/heads/hotfix/editorial-atemporal-animacao-foton-20261113
          fi
