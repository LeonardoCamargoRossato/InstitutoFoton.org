name: Temporary Mobi carousel formatter
on:
  push:
    branches:
      - feat/mobi-quantum-carrossel-assets-20261116
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Print Prettier diff for edited files
        working-directory: code
        run: |
          npm ci
          npx prettier --write src/features/Publications.tsx src/features/NewsMedia.css tests/browser/news-partnerships.spec.ts tests/news.test.ts
          git diff -- src/features/Publications.tsx src/features/NewsMedia.css tests/browser/news-partnerships.spec.ts tests/news.test.ts
