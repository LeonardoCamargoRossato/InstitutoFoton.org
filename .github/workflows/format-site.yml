name: Format site sources
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - run: npx prettier --write src/app/Layout.tsx src/components/InstituteTeamDashboard.css src/components/InstituteTeamDashboard.tsx src/content/instituteTeam.ts
        working-directory: code
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/app/Layout.tsx code/src/components/InstituteTeamDashboard.css code/src/components/InstituteTeamDashboard.tsx code/src/content/instituteTeam.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar dashboard e navegação com Prettier"
            git push origin HEAD:main
          fi
