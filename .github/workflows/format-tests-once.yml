name: Format updated browser tests
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - run: npx prettier --write tests/browser/ResearchJourney.spec.ts tests/browser/site.spec.ts
        working-directory: code
      - name: Commit formatted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/tests/browser/ResearchJourney.spec.ts code/tests/browser/site.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: formatar testes do menu atualizado"
            git push origin HEAD:main
          fi
