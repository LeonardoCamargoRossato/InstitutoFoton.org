name: LCR one-shot official presentation WebP previews
on:
  push:
    branches:
      - hotfix/home-preview-apresentacao-webp-20261114
    paths:
      - .github/workflows/lcr-render-presentation-once.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Provide PDF image renderer
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Extract page 1 and 2 of official public PDF as WebP
        run: node scripts/generate-presentation-preview.mjs
      - name: Commit preview images without modifying source PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/assets/WebP/apresentacao/apresentacao-foton-pagina-01.webp public/assets/WebP/apresentacao/apresentacao-foton-pagina-02.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(home): commit two WebP previews from the official presentation PDF"
            git push origin HEAD:refs/heads/hotfix/home-preview-apresentacao-webp-20261114
          fi
