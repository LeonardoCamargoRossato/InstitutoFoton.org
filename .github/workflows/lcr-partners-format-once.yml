name: LCR one-shot partner hotfix formatting
on:
  push:
    branches:
      - feat/ecossistema-svg-builder2-20261113
    paths:
      - .github/workflows/lcr-partners-format-once.yml

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Apply existing Prettier configuration
        run: npm exec -- prettier --write .
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .
          if ! git diff --cached --quiet; then
            git commit -m "style(partners): format hotfix components, scripts and tests"
            git push origin HEAD:refs/heads/feat/ecossistema-svg-builder2-20261113
          fi
