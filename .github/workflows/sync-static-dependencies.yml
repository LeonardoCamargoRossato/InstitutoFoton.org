name: Synchronize dependency lock for static portal
on:
  push:
    branches: [refactor/foton-static-no-supabase-20261112]
    paths: ['.github/workflows/sync-static-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Remove unused Supabase frontend library, preserve legacy schema
        run: npm --prefix code uninstall @supabase/supabase-js
      - name: Verify package lock is consistent
        run: npm --prefix code ci
      - name: Commit updated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/package.json code/package-lock.json
          git commit -m "chore(deps): remove unused Supabase JavaScript client"
          git push origin HEAD:refactor/foton-static-no-supabase-20261112
