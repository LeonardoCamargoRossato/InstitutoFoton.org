name: Prepare WebP media + source inventory

on:
  push:
    branches: [feature/foton-webp-zoom-20261112]
    paths: ['.github/workflows/foton-media-optimize.yml', 'code/scripts/prepare-webp.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install media transformer
        run: |
          npm --prefix code install --no-save --package-lock=false sharp
          command -v zip
      - name: Download public Foton media and create responsive WebP
        run: node code/scripts/prepare-webp.mjs
      - name: Archive original assets and manifest
        uses: actions/upload-artifact@v4
        with:
          name: foton-assets-originais
          path: |
            code/.asset-staging/pacotes/Assets-do-site-originais.zip
            code/.asset-staging/inventory.json
          retention-days: 7
      - name: Archive optimized assets and manifest
        uses: actions/upload-artifact@v4
        with:
          name: foton-assets-webpg
          path: |
            code/.asset-staging/pacotes/Assets-WebPG-otimizados.zip
            code/.asset-staging/inventory.json
          retention-days: 7
      - name: Save WebP files to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code/public/images/webp
          if ! git diff --cached --quiet; then
            git commit -m 'chore(media): add locally served WebP preview assets'
            git push origin HEAD:feature/foton-webp-zoom-20261112
          fi
