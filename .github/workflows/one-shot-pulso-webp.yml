name: Geração pontual do WebP — Etapa Pulso
on:
  push:
    branches:
      - feat/asset-migration-drive-20261115
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - name: Converter PNG em WebP sem alterar o original
        working-directory: code
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir, stat } from 'node:fs/promises';
          const root = 'public/assets/04 - P&D - Cientista Inovador/04B - Jornadas do Cientista Inovador/Imagens da Jornada/';
          const png = root + 'PNG/EtapaPulsoYouTube.png';
          const webp = root + 'WebP/EtapaPulsoYouTube.webp';
          await mkdir(root + 'WebP', { recursive: true });
          const info = await sharp(png).metadata();
          if (info.width !== 1280 || info.height !== 720 || info.format !== 'png') {
            throw new Error('A origem PNG mudou ou não corresponde à Etapa Pulso aprovada');
          }
          await sharp(png).webp({ quality: 85, effort: 6 }).toFile(webp);
          const out = await sharp(webp).metadata();
          if (out.format !== 'webp' || out.width !== info.width || out.height !== info.height) {
            throw new Error('Conversão WebP inválida');
          }
          console.log('PNG bytes', (await stat(png)).size, 'WebP bytes', (await stat(webp)).size);
          NODE
      - name: Disponibilizar PNG e WebP para sincronização com Google Drive
        uses: actions/upload-artifact@v4
        with:
          name: etapa-pulso-png-webp
          path: |
            code/public/assets/04 - P&D - Cientista Inovador/04B - Jornadas do Cientista Inovador/Imagens da Jornada/PNG/EtapaPulsoYouTube.png
            code/public/assets/04 - P&D - Cientista Inovador/04B - Jornadas do Cientista Inovador/Imagens da Jornada/WebP/EtapaPulsoYouTube.webp
          if-no-files-found: error
          retention-days: 7
      - name: Salvar WebP na branch e remover workflow pontual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'code/public/assets/04 - P&D - Cientista Inovador/04B - Jornadas do Cientista Inovador/Imagens da Jornada/WebP/EtapaPulsoYouTube.webp'
          git rm -- .github/workflows/one-shot-pulso-webp.yml
          git commit -m "feat(assets): criar WebP oficial da Etapa Pulso"
          git push origin HEAD:feat/asset-migration-drive-20261115
