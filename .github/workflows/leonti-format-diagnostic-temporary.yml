name: Temporary Leonti format diagnostic
on:
  push:
    branches:
      - feat/uniso-leonti-cover-highlights-20261117
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: code
      - name: Show exact Prettier diff
        working-directory: code
        run: |
          npx prettier --write src/components/NewsPhotoHighlights.tsx src/features/Publications.tsx tests/browser/news-partnerships.spec.ts
          git diff -- src/components/NewsPhotoHighlights.tsx src/features/Publications.tsx tests/browser/news-partnerships.spec.ts
