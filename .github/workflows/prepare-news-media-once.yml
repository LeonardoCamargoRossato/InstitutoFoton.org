name: Preparar midias de noticias (temporario)
on:
  push:
    branches: [feat/noticias-parcerias-20261114]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/noticias-parcerias-20261114
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - name: Criar WebP para todos os originais preservando nomes
        working-directory: code
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { readFile, writeFile } from 'node:fs/promises';
          const media = JSON.parse(await readFile('src/content/news-media.json','utf8'));
          for (const image of media) {
            const input = 'public/' + image.original;
            const output = 'public/' + image.preview;
            await sharp(input).webp({ quality: 82, effort: 5 }).toFile(output);
            console.log(image.original, '=>', image.preview);
          }
          NODE
      - name: Formatar código editado
        working-directory: code
        run: npx prettier --write src/content/publications.json src/content/news-media.json src/features/Publications.tsx src/features/NewsMedia.css scripts/check-pages-artifact.mjs scripts/postbuild.mjs
      - name: Commitar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/public/assets/noticias code/src/content/publications.json code/src/content/news-media.json code/src/features/Publications.tsx code/src/features/NewsMedia.css code/scripts/check-pages-artifact.mjs code/scripts/postbuild.mjs
          if ! git diff --cached --quiet; then
            git commit -m "assets(noticias): gerar WebP e aplicar formatacao"
            git push origin HEAD:feat/noticias-parcerias-20261114
          fi
