name: Repair alpha channel on Manifesto preview
on:
  push:
    branches: [refactor/foton-static-no-supabase-20261112]
    paths: ['.github/workflows/fix-manifesto-alpha.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - name: Restore alpha and original 535x288 dimensions
        run: |
          node --input-type=module -e "import sharp from 'sharp';const p='public/assets/PNG/manifesto-quantico/OqueeoManifestoQuanticoNacional.png';const o='public/assets/WebP/manifesto-quantico/OqueeoManifestoQuanticoNacional.webp';await sharp(p).webp({lossless:true,effort:6}).toFile(o);const m=await sharp(o).metadata();if(!m.hasAlpha||m.width!==535||m.height!==288)throw Error('Canal alfa não preservado')"
          node scripts/prepare-webp.mjs
        working-directory: code
      - name: Commit restored WebP (not PNG)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/public/assets/WebP/manifesto-quantico/OqueeoManifestoQuanticoNacional.webp
          git commit -m "fix(media): preserve alpha of manifesto graphic in WebP"
          git push origin HEAD:refactor/foton-static-no-supabase-20261112
