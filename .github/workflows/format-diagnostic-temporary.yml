name: Temporary format diagnostic
on:
  push:
    branches:
      - feat/quantum-day-shared-carousels-20261117
permissions:
  contents: read
jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: code
      - name: Show exact Prettier changes (read-only)
        working-directory: code
        run: |
          npx prettier --write src/components/NewsCarousel.tsx
          git diff -- src/components/NewsCarousel.tsx
