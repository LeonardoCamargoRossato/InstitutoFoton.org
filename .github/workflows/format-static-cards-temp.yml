name: Format static card catalogue (temporary)
on:
  push:
    branches: [fix/cards-informativos-catalogo-20261122]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cards-informativos-catalogo-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install deps
        working-directory: code
        run: npm ci
      - name: Format only changed registry and tests
        working-directory: code
        run: |
          npx prettier --write src/content/MAPA_SECOES_E_CARDS.md src/content/siteCards.ts src/content/siteStructure.ts tests/browser/cards-static-hover.spec.ts tests/site-structure.test.ts src/features/OfficialStatements.tsx
      - name: Commit format to isolated branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/content/MAPA_SECOES_E_CARDS.md code/src/content/siteCards.ts code/src/content/siteStructure.ts code/tests/browser/cards-static-hover.spec.ts code/tests/site-structure.test.ts code/src/features/OfficialStatements.tsx
          git commit -m "style(lcr): formatar catálogo e testes de cards estáticos"
          git push origin HEAD:fix/cards-informativos-catalogo-20261122
