name: Format visits carousel branch (temporary)
on:
  push:
    branches: [feat/padronizar-carrossel-visitas-20261122]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/padronizar-carrossel-visitas-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install dependencies
        working-directory: code
        run: npm ci
      - name: Format modified files only
        working-directory: code
        run: |
          npx prettier --write src/components/carousel/PARAMETROS_DO_CARROSSEL.md tests/browser/carousel-universal.spec.ts tests/browser/editorial.spec.ts
      - name: Commit format to feature branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/components/carousel/PARAMETROS_DO_CARROSSEL.md code/tests/browser/carousel-universal.spec.ts code/tests/browser/editorial.spec.ts
          git commit -m "style(carousel): aplicar Prettier após migrar Visitas"
          git push origin HEAD:feat/padronizar-carrossel-visitas-20261122
