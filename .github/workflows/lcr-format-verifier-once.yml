name: LCR one-shot format Pages verifier
on:
  push:
    branches:
      - feat/ecossistema-svg-builder2-20261113
    paths:
      - .github/workflows/lcr-format-verifier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm exec -- prettier --write scripts/check-pages-artifact.mjs
      - name: Commit format correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/check-pages-artifact.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(partners): format artifact allowlist verifier"
            git push origin HEAD:refs/heads/feat/ecossistema-svg-builder2-20261113
          fi
