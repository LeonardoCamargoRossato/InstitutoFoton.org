name: LCR one-shot format editorial and photon identity
on:
  push:
    branches:
      - hotfix/editorial-atemporal-animacao-foton-20261113
    paths:
      - .github/workflows/lcr-editorial-prettier-once.yml
permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Format only hotfix files
        run: npx prettier --write src/features/PublicPages.tsx src/styles/photon-identity.css tests/browser/institutional-evergreen.spec.ts tests/browser/site.spec.ts
      - name: Commit Prettier corrections on hotfix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/features/PublicPages.tsx src/styles/photon-identity.css tests/browser/institutional-evergreen.spec.ts tests/browser/site.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(editorial): format evergreen content and photon animation"
            git push origin HEAD:refs/heads/hotfix/editorial-atemporal-animacao-foton-20261113
          fi
