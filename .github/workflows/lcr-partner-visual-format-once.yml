name: LCR format partner visual adjustment
on:
  push:
    branches:
      - feat/ecossistema-svg-builder2-20261113
    paths:
      - .github/workflows/lcr-partner-visual-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - name: Apply Prettier to changed visual files
        run: npx prettier --write src/styles/partners.css tests/browser/partners-performance.spec.ts
      - name: Commit formatting of visual hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/styles/partners.css tests/browser/partners-performance.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(partners): format focused white-card and logo-size fix"
            git push origin HEAD:refs/heads/feat/ecossistema-svg-builder2-20261113
          fi
