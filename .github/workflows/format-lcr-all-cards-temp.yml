name: Format LCR remaining cards (temporary)
on:
  push:
    branches: [refactor/lcr-todos-cards-20261122]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lcr-todos-cards-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Install locked dependencies
        working-directory: code
        run: npm ci
      - name: Format changed TS, TSX and docs
        working-directory: code
        run: |
          npx prettier --write             src/components/FoundationHistory.tsx             src/components/InstitutePurpose.tsx             src/components/InstituteTeamDashboard.tsx             src/components/NewsPhotoHighlights.tsx             src/components/UI.tsx             src/components/cards/INVENTARIO_DOS_CARDS.md             src/components/cards/PARAMETROS_DOS_CARDS.md             src/components/cards/base/BaseCard.tsx             src/components/cards/base/card.appearance.ts             src/components/cards/base/card.types.ts             src/components/cards/interactive/ActionCard.tsx             src/components/cards/interactive/ImageCard.tsx             src/components/cards/interactive/ProfileCard.tsx             src/content/MAPA_SECOES_E_CARDS.md             src/content/siteCards.ts             src/content/siteStructure.ts             src/features/InstagramHighlight.tsx             src/features/LinkedInHighlight.tsx             src/features/ManifestoHero.tsx             src/features/OfficialStatements.tsx             src/features/PartnerEcosystem.tsx             src/features/PartnersPage.tsx             src/features/PublicPages.tsx             src/features/Publications.tsx             src/features/ResearchPages.tsx             src/features/SocialMediaPage.tsx             src/features/Support.tsx             src/features/TransparencyBoard.tsx             src/features/YouTubeHighlight.tsx             tests/browser/cards-full-migration.spec.ts             tests/cards.test.tsx             tests/site-structure.test.ts
      - name: Commit formatting to feature branch only
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/components code/src/content code/src/features code/tests
          git commit -m "style(lcr): formatar migração dos cards e mapa de seções"
          git push origin HEAD:refactor/lcr-todos-cards-20261122
